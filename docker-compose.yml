services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-ownloom}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
    expose:
      - "5432"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:5002"
    volumes:
      - media_volume:/app/media
    expose:
      - "5002"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me}
      - DEBUG=${DEBUG:-False}
      - DB_NAME=${DB_NAME:-ownloom}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5006:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
