    services:
      # The Database Service
      db:
        image: postgres:15
        volumes:
          - postgres_data:/var/lib/postgresql/data/
        environment:
          - POSTGRES_DB=${DB_NAME:-ownloom}
          - POSTGRES_USER=${DB_USER:-postgres}
          - POSTGRES_PASSWORD=${DB_PASS:-postgres}
        expose:
          - "5432"

      # The Backend Service
      backend:
        build:
          context: ./backend
          args:
            APP_ENV: production
        command: >
          sh -c "python manage.py migrate &&
                 gunicorn backend.wsgi:application --bind 0.0.0.0:5002"
        volumes:
          - media_volume:/app/media
        expose:
          - "5002"
        environment:
          - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me}
          - DEBUG=${DEBUG:-False}
          - DB_NAME=${DB_NAME:-ownloom}
          - DB_USER=${DB_USER:-postgres}
          - DB_PASS=${DB_PASS:-postgres}
          - DB_HOST=db
          - DB_PORT=5432
          - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
          - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
        depends_on:
          - db

      # The Frontend Service
      frontend:
        build:
          context: ./frontend
          args:
            VITE_API_BASE_URL: ""
        ports:
          - "${FRONTEND_PORT:-5002}:80"
        depends_on:
          - backend

    volumes:
      postgres_data:
      media_volume:
    
