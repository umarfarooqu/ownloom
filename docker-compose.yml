    services:
      # The Database Service
      db:
        image: postgres:15
        volumes:
          - postgres_data:/var/lib/postgresql/data/
        environment:
          - POSTGRES_DB=${DB_NAME}
          - POSTGRES_USER=${DB_USER}
          - POSTGRES_PASSWORD=${DB_PASS}
        expose:
          - "5432"

      # The Backend Service
      backend:
        build: ./backend
        command: >
          sh -c "python manage.py migrate &&
                 gunicorn backend.wsgi:application --bind 0.0.0.0:5002"
        volumes:
          - media_volume:/app/media
        expose:
          - "5002"
        environment:
          - SECRET_KEY=${SECRET_KEY}
          - DEBUG=${DEBUG}
          - DB_NAME=${DB_NAME}
          - DB_USER=${DB_USER}
          - DB_PASS=${DB_PASS}
          - DB_HOST=db
          - DB_PORT=5432
        depends_on:
          - db

      # The Frontend Service
      frontend:
        build: ./frontend
        ports:
          - "5002:80"
        depends_on:
          - backend

    volumes:
      postgres_data:
      media_volume:
    
